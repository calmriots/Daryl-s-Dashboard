<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0B1E3F">
<title>1-Group · Marketing Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/mammoth/mammoth.browser.min.js"></script>
<script src="assets/logos.js"></script>
<style>
/* ============================================================
   1-GROUP MARKETING DASHBOARD — Superlist-inspired
   Brand: 1-Group navy/blue gradient
   Type:  Space Grotesk (display/UI) + Inter (body)
============================================================ */
:root {
  /* Brand */
  --navy-900: #0B1E3F;
  --navy-800: #112A55;
  --navy-700: #1E3A8A;
  --navy-600: #2848A9;
  --navy-500: #3B82F6;
  --navy-400: #60A5FA;
  --navy-300: #93C5FD;
  --sky-300:  #7DD3FC;
  --sky-200:  #BAE6FD;

  /* Light surfaces */
  --bg: #FAFAF7;
  --surface: #FFFFFF;
  --surface-2: #F4F3EE;
  --surface-3: #EDEBE4;
  --line: rgba(11, 30, 63, 0.08);
  --line-2: rgba(11, 30, 63, 0.14);
  --ink: #0B1E3F;
  --ink-2: #334155;
  --muted: rgba(11, 30, 63, 0.55);
  --faint: rgba(11, 30, 63, 0.04);

  /* Semantic */
  --danger: #DC2626;
  --danger-bg: #FEE2E2;
  --warn: #D97706;
  --warn-bg: #FEF3C7;
  --ok: #059669;
  --ok-bg: #D1FAE5;
  --info-bg: #DBEAFE;

  /* Priority */
  --p-high: #DC2626;
  --p-med: #D97706;
  --p-low: #0891B2;

  /* Radii + shadows */
  --r-sm: 6px;
  --r-md: 10px;
  --r-lg: 14px;
  --r-xl: 20px;
  --shadow-sm: 0 1px 2px rgba(11,30,63,0.05);
  --shadow-md: 0 4px 14px rgba(11,30,63,0.08);
  --shadow-lg: 0 16px 40px rgba(11,30,63,0.14);

  --sidebar-w: 260px;
  --sidebar-w-collapsed: 64px;
  --topbar-h: 56px;
}

html.dark {
  --bg: #0A1428;
  --surface: #0F1D38;
  --surface-2: #142548;
  --surface-3: #1A2D56;
  --line: rgba(255,255,255,0.07);
  --line-2: rgba(255,255,255,0.12);
  --ink: #F1F5F9;
  --ink-2: #CBD5E1;
  --muted: rgba(241, 245, 249, 0.55);
  --faint: rgba(255,255,255,0.03);
  --danger-bg: rgba(220,38,38,0.18);
  --warn-bg: rgba(217,119,6,0.18);
  --ok-bg: rgba(5,150,105,0.18);
  --info-bg: rgba(59,130,246,0.18);
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.4);
  --shadow-md: 0 4px 14px rgba(0,0,0,0.45);
  --shadow-lg: 0 16px 40px rgba(0,0,0,0.55);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  font-size: 14px;
  color: var(--ink);
  background: var(--bg);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow-x: hidden;
}
.display { font-family: 'Space Grotesk', sans-serif; letter-spacing: -0.02em; }
button { font-family: inherit; }
input, textarea, select { font-family: inherit; }
a { color: var(--navy-500); text-decoration: none; }
a:hover { text-decoration: underline; }

/* ============================================================
   SETUP SCREEN
============================================================ */
#setup-screen {
  position: fixed; inset: 0;
  display: flex; align-items: center; justify-content: center;
  background: linear-gradient(135deg, var(--navy-900) 0%, var(--navy-700) 55%, var(--navy-500) 100%);
  padding: 1.5rem; z-index: 1000;
}
.setup-card {
  background: var(--surface); border-radius: var(--r-xl);
  padding: 2.5rem; width: 100%; max-width: 440px;
  box-shadow: var(--shadow-lg);
}
.setup-logo { display: flex; justify-content: center; margin-bottom: 1.5rem; }
.setup-logo img { width: 88px; height: 88px; object-fit: contain; }
.setup-card h1 {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 28px; font-weight: 700; letter-spacing: -0.03em;
  text-align: center; margin-bottom: 8px;
}
.setup-card .sub {
  text-align: center; font-size: 14px; color: var(--muted);
  margin-bottom: 2rem;
}
.setup-card input {
  width: 100%; padding: 12px 14px;
  border: 1.5px solid var(--line-2); border-radius: var(--r-md);
  font-size: 14px; background: var(--bg); color: var(--ink);
  margin-bottom: 10px; transition: border-color 0.15s, box-shadow 0.15s;
}
.setup-card input:focus {
  outline: none; border-color: var(--navy-500);
  box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.18);
}
.setup-card .msg {
  font-size: 13px; color: var(--danger);
  min-height: 20px; margin-top: 6px;
}
.setup-card .note {
  font-size: 12px; color: var(--muted); text-align: center;
  margin-top: 1.25rem; line-height: 1.6;
}
.share-box {
  background: var(--surface-2); border-radius: var(--r-md);
  padding: 14px; margin-top: 1rem; font-size: 13px;
}
.share-url {
  font-family: 'JetBrains Mono', ui-monospace, monospace;
  font-size: 11px; color: var(--navy-600);
  word-break: break-all; margin: 6px 0;
}

/* ============================================================
   APP SHELL
============================================================ */
#app { display: none; min-height: 100vh; }
#app.active { display: flex; }

/* Sidebar */
.sidebar {
  width: var(--sidebar-w); flex-shrink: 0;
  background: var(--surface); border-right: 1px solid var(--line);
  display: flex; flex-direction: column;
  position: sticky; top: 0; height: 100vh;
  transition: width 0.22s ease;
  z-index: 50;
}
.sidebar.collapsed { width: var(--sidebar-w-collapsed); }
.sidebar.collapsed .sb-label,
.sidebar.collapsed .sb-section-title,
.sidebar.collapsed .sb-brand-text,
.sidebar.collapsed .sb-count,
.sidebar.collapsed .sb-user-meta {
  display: none;
}
.sidebar.collapsed .sb-item { justify-content: center; padding: 10px; }
.sidebar.collapsed .sb-brand { justify-content: center; padding: 1rem 0; }
.sidebar.collapsed .sb-user { justify-content: center; }

.sb-brand {
  padding: 1.125rem 1rem 1rem;
  display: flex; align-items: center; gap: 10px;
  border-bottom: 1px solid var(--line);
}
.sb-brand img { width: 32px; height: 32px; object-fit: contain; flex-shrink: 0; }
.sb-brand-text { display: flex; flex-direction: column; min-width: 0; }
.sb-brand-text .t1 {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 15px; font-weight: 700; letter-spacing: -0.02em;
  color: var(--ink); line-height: 1.2;
}
.sb-brand-text .t2 {
  font-size: 11px; color: var(--muted); font-weight: 500;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

.sb-scroll {
  flex: 1; overflow-y: auto; overflow-x: hidden;
  padding: 10px 8px;
  scrollbar-width: thin; scrollbar-color: var(--line-2) transparent;
}
.sb-scroll::-webkit-scrollbar { width: 6px; }
.sb-scroll::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 3px; }

.sb-section-title {
  font-size: 10px; font-weight: 600; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--muted);
  padding: 14px 10px 6px;
}
.sb-item {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 10px; border-radius: var(--r-md);
  cursor: pointer; color: var(--ink-2);
  font-size: 13.5px; font-weight: 500;
  margin-bottom: 2px;
  transition: background 0.12s, color 0.12s;
  border: none; background: transparent; width: 100%; text-align: left;
  position: relative;
}
.sb-item:hover { background: var(--faint); color: var(--ink); }
.sb-item.active {
  background: linear-gradient(90deg, var(--navy-700), var(--navy-500));
  color: white;
  box-shadow: 0 2px 8px rgba(30,58,138,0.25);
}
.sb-item.active .sb-count { background: rgba(255,255,255,0.22); color: white; }
.sb-item .sb-icon {
  width: 18px; height: 18px; flex-shrink: 0;
  display: inline-flex; align-items: center; justify-content: center;
}
.sb-item .sb-icon svg { width: 100%; height: 100%; }
.sb-label { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sb-count {
  font-size: 11px; font-weight: 600;
  background: var(--surface-2); color: var(--muted);
  padding: 1px 8px; border-radius: 100px;
  min-width: 22px; text-align: center;
}
.sb-count.attn { background: var(--danger-bg); color: var(--danger); }

.sb-footer {
  border-top: 1px solid var(--line); padding: 10px 8px;
  display: flex; flex-direction: column; gap: 4px;
}
.sb-user {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 10px; border-radius: var(--r-md);
  cursor: pointer; transition: background 0.12s;
}
.sb-user:hover { background: var(--faint); }
.sb-avatar {
  width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0;
  background: linear-gradient(135deg, var(--navy-500), var(--navy-700));
  color: white; font-weight: 600; font-size: 12px;
  display: flex; align-items: center; justify-content: center;
}
.sb-user-meta { flex: 1; min-width: 0; }
.sb-user-meta .n { font-size: 13px; font-weight: 600; color: var(--ink); line-height: 1.2; }
.sb-user-meta .s { font-size: 11px; color: var(--muted); }

/* Main region */
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 100vh; }

/* Topbar */
.topbar {
  height: var(--topbar-h);
  display: flex; align-items: center;
  padding: 0 1.25rem; gap: 10px;
  border-bottom: 1px solid var(--line);
  background: color-mix(in oklab, var(--surface) 88%, transparent);
  backdrop-filter: saturate(180%) blur(10px);
  -webkit-backdrop-filter: saturate(180%) blur(10px);
  position: sticky; top: 0; z-index: 40;
}
.tb-toggle, .tb-action {
  width: 34px; height: 34px; border-radius: 8px;
  border: none; background: transparent; cursor: pointer;
  color: var(--ink-2);
  display: inline-flex; align-items: center; justify-content: center;
  transition: background 0.12s, color 0.12s;
}
.tb-toggle:hover, .tb-action:hover { background: var(--faint); color: var(--ink); }
.tb-title {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 16px; font-weight: 600; letter-spacing: -0.01em;
  flex: 1; min-width: 0;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.tb-search {
  width: 240px; max-width: 34vw;
  background: var(--surface-2); border: 1px solid transparent;
  border-radius: var(--r-md); padding: 7px 12px 7px 34px;
  font-size: 13px; color: var(--ink);
  position: relative;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%23667'  stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><circle cx='11' cy='11' r='8'/><path d='m21 21-4.3-4.3'/></svg>");
  background-repeat: no-repeat; background-position: 10px center;
  transition: background 0.12s, border-color 0.12s;
}
.tb-search:focus {
  outline: none; border-color: var(--navy-500);
  background-color: var(--surface);
  box-shadow: 0 0 0 3px rgba(59,130,246,0.12);
}
.tb-sync {
  font-size: 11px; font-weight: 600; letter-spacing: 0.04em;
  color: var(--muted); padding: 5px 10px;
  border-radius: 100px; background: var(--faint);
  display: none; align-items: center; gap: 6px;
}
.tb-sync.on { display: inline-flex; }
.tb-sync .dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--ok); animation: pulse 1.2s infinite;
}
@keyframes pulse {
  0%,100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.5; transform: scale(1.3); }
}

/* Content */
.content {
  flex: 1; padding: 1.75rem 2rem 4rem;
  max-width: 1280px; width: 100%;
  margin: 0 auto;
}
.content.narrow { max-width: 900px; }

/* Page header */
.pg-header {
  display: flex; align-items: flex-end; justify-content: space-between;
  gap: 16px; margin-bottom: 1.5rem; flex-wrap: wrap;
}
.pg-header h1 {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 36px; font-weight: 700; letter-spacing: -0.035em;
  line-height: 1.05;
}
.pg-header .pg-sub { font-size: 14px; color: var(--muted); margin-top: 6px; }
.pg-header .pg-actions { display: flex; gap: 8px; }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 14px; font-size: 13px; font-weight: 600;
  border-radius: var(--r-md); border: 1px solid var(--line-2);
  background: var(--surface); color: var(--ink);
  cursor: pointer;
  transition: background 0.12s, border-color 0.12s, transform 0.08s;
}
.btn:hover { background: var(--surface-2); }
.btn:active { transform: scale(0.97); }
.btn.primary {
  background: linear-gradient(135deg, var(--navy-700), var(--navy-500));
  color: white; border-color: transparent;
  box-shadow: 0 4px 14px rgba(30,58,138,0.25);
}
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--faint); }
.btn.danger { color: var(--danger); border-color: var(--line-2); }
.btn.danger:hover { background: var(--danger-bg); border-color: var(--danger); }
.btn.sm { padding: 5px 10px; font-size: 12px; }
.btn.xs { padding: 3px 8px; font-size: 11px; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }

/* Metrics row */
.metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 1.5rem; }
.met {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r-lg); padding: 16px 18px;
  transition: transform 0.15s, box-shadow 0.15s;
}
.met:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
.met .ml { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.met .mv { font-family: 'Space Grotesk', sans-serif; font-size: 32px; font-weight: 700; letter-spacing: -0.03em; }
.met.attn .mv { color: var(--danger); }
.met.attn .ml { color: var(--danger); }

/* Cards */
.card {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r-lg); padding: 18px 20px;
  margin-bottom: 14px;
  transition: box-shadow 0.15s;
}
.card:hover { box-shadow: var(--shadow-sm); }

/* Section heading */
.sh {
  font-size: 11px; font-weight: 700; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--muted);
  margin-bottom: 12px; display: flex; align-items: center; gap: 8px;
}
.sh .line { flex: 1; height: 1px; background: var(--line); }

/* Task row — the core Superlist-style component */
.task {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 12px 14px;
  border-bottom: 1px solid var(--line);
  cursor: pointer;
  position: relative;
  transition: background 0.1s;
}
.task:last-child { border-bottom: none; }
.task:hover { background: var(--faint); }
.task.expanded { background: var(--faint); }

.task-chk {
  width: 20px; height: 20px; border-radius: 6px;
  border: 1.5px solid var(--line-2);
  flex-shrink: 0; margin-top: 1px;
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--surface);
  cursor: pointer;
  transition: all 0.15s;
  position: relative;
}
.task-chk:hover { border-color: var(--navy-500); }
.task-chk.done {
  background: linear-gradient(135deg, var(--navy-700), var(--navy-500));
  border-color: transparent;
}
.task-chk svg { width: 12px; height: 12px; stroke: white; }
.task-chk.done { animation: tick-pop 0.32s cubic-bezier(.5,1.7,.6,1); }
@keyframes tick-pop {
  0% { transform: scale(0.7); }
  60% { transform: scale(1.2); }
  100% { transform: scale(1); }
}

.task-main { flex: 1; min-width: 0; }
.task-title {
  font-size: 14px; color: var(--ink); font-weight: 500;
  line-height: 1.4; word-break: break-word;
  display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
}
.task-title.done { color: var(--muted); text-decoration: line-through; }
.task-desc-preview {
  font-size: 12px; color: var(--muted);
  margin-top: 3px;
  display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical;
  overflow: hidden;
}
.task-meta {
  display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
  margin-top: 6px;
}
.task-due {
  font-size: 11px; color: var(--muted);
  white-space: nowrap; flex-shrink: 0;
  margin-left: auto; padding-top: 2px;
}
.task-due.overdue { color: var(--danger); font-weight: 600; }
.task-due.today { color: var(--warn); font-weight: 600; }

/* Priority flag */
.prio {
  width: 12px; height: 12px; flex-shrink: 0;
  display: inline-flex; align-items: center; justify-content: center;
}
.prio svg { width: 100%; height: 100%; }
.prio.high svg { fill: var(--p-high); }
.prio.med svg { fill: var(--p-med); }
.prio.low svg { fill: var(--p-low); }

/* Chips */
.chip {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 11px; font-weight: 500;
  padding: 2px 9px; border-radius: 100px;
  background: var(--surface-2); color: var(--ink-2);
  border: 1px solid var(--line);
  white-space: nowrap;
}
.chip.people { background: var(--info-bg); color: var(--navy-700); border-color: transparent; }
html.dark .chip.people { color: var(--navy-300); }
.chip.label { background: transparent; border: 1px solid var(--line-2); color: var(--muted); font-weight: 600; letter-spacing: 0.02em; text-transform: uppercase; font-size: 10px; }
.chip.cat { background: rgba(59,130,246,0.1); color: var(--navy-600); border-color: transparent; }
html.dark .chip.cat { color: var(--navy-300); }

/* Status badge */
.badge {
  display: inline-block; padding: 2px 9px;
  border-radius: 100px; font-size: 10px; font-weight: 700;
  letter-spacing: 0.05em; text-transform: uppercase;
  white-space: nowrap;
}
.badge.active { background: var(--ok-bg); color: var(--ok); }
.badge.planned { background: var(--info-bg); color: var(--navy-700); }
html.dark .badge.planned { color: var(--navy-300); }
.badge.inprog { background: var(--warn-bg); color: var(--warn); }
.badge.done { background: var(--surface-2); color: var(--muted); }
.badge.blocked { background: var(--danger-bg); color: var(--danger); }
.badge.notstarted { background: var(--surface-2); color: var(--muted); }
.badge.pending { background: var(--warn-bg); color: var(--warn); }
.badge.accepted { background: var(--ok-bg); color: var(--ok); }
.badge.rejected { background: var(--danger-bg); color: var(--danger); }

/* Expanded task detail */
.task-exp {
  background: var(--surface-2); border-radius: var(--r-md);
  border: 1px solid var(--line);
  padding: 16px; margin: 6px 14px 14px 46px;
  animation: slideDown 0.2s ease-out;
}
@keyframes slideDown {
  from { opacity: 0; transform: translateY(-8px); }
  to { opacity: 1; transform: translateY(0); }
}
.exp-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 12px; }
.exp-label {
  font-size: 10px; font-weight: 700; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--muted);
  margin-bottom: 5px;
}
.field {
  width: 100%; padding: 7px 10px;
  border: 1px solid var(--line-2); border-radius: var(--r-sm);
  background: var(--surface); color: var(--ink);
  font-size: 13px;
  transition: border-color 0.12s, box-shadow 0.12s;
}
.field:focus {
  outline: none; border-color: var(--navy-500);
  box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
}
textarea.field { resize: vertical; min-height: 56px; font-family: inherit; }

/* Who chip selectable */
.who-chip {
  display: inline-block; padding: 4px 10px; border-radius: 100px;
  font-size: 11px; font-weight: 500; margin: 3px 3px 0 0;
  background: var(--surface); border: 1px solid var(--line-2);
  color: var(--ink-2); cursor: pointer;
  transition: all 0.12s;
}
.who-chip:hover { border-color: var(--navy-500); }
.who-chip.sel {
  background: linear-gradient(135deg, var(--navy-700), var(--navy-500));
  color: white; border-color: transparent;
}

/* Sub-tasks */
.subtasks {
  margin-top: 10px; padding-left: 14px;
  border-left: 2px solid var(--line);
}
.subtask {
  display: flex; align-items: center; gap: 10px;
  padding: 6px 0;
  font-size: 13px;
}
.subtask-chk {
  width: 16px; height: 16px; border-radius: 4px;
  border: 1.5px solid var(--line-2); flex-shrink: 0;
  display: inline-flex; align-items: center; justify-content: center;
  cursor: pointer; background: var(--surface);
}
.subtask-chk.done {
  background: var(--navy-500); border-color: transparent;
}
.subtask-chk svg { width: 10px; height: 10px; stroke: white; }
.subtask-text { flex: 1; border: none; background: transparent; color: var(--ink); font-size: 13px; padding: 2px; }
.subtask-text:focus { outline: none; }
.subtask.done .subtask-text { color: var(--muted); text-decoration: line-through; }
.subtask-del {
  background: transparent; border: none; color: var(--muted);
  cursor: pointer; font-size: 14px; padding: 2px 6px; opacity: 0; transition: opacity 0.12s;
}
.subtask:hover .subtask-del { opacity: 1; }
.subtask-add {
  display: flex; align-items: center; gap: 10px;
  padding: 6px 0;
  font-size: 13px; color: var(--muted);
  cursor: pointer;
}
.subtask-add .subtask-chk { border-style: dashed; opacity: 0.6; }

/* Campaign card — Superlist "list" style */
.camp {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r-lg);
  margin-bottom: 14px; overflow: hidden;
  transition: box-shadow 0.15s, transform 0.15s;
}
.camp:hover { box-shadow: var(--shadow-sm); }
.camp-accent {
  height: 4px; width: 100%;
  background: linear-gradient(90deg, var(--accent, var(--navy-500)), var(--navy-500));
}
.camp-body {
  padding: 18px 20px;
  display: flex; gap: 16px;
}
.camp-img {
  width: 90px; height: 120px; border-radius: var(--r-md);
  object-fit: cover; flex-shrink: 0;
  background: var(--surface-2);
}
.camp-content { flex: 1; min-width: 0; }
.camp-title {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 20px; font-weight: 700; letter-spacing: -0.02em;
  margin-bottom: 4px;
  display: flex; align-items: center; gap: 8px;
}
.camp-sub { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
.camp-desc { font-size: 13px; color: var(--ink-2); line-height: 1.55; margin-bottom: 10px; }
.camp-progress { height: 6px; background: var(--surface-2); border-radius: 100px; overflow: hidden; }
.camp-progress-fill {
  height: 100%; border-radius: 100px;
  background: linear-gradient(90deg, var(--navy-700), var(--navy-500));
  transition: width 0.3s;
}
.camp-footer {
  display: flex; align-items: center; justify-content: space-between;
  flex-wrap: wrap; gap: 8px;
  margin-top: 10px;
  font-size: 12px; color: var(--muted);
}
.camp-tasks-wrap {
  border-top: 1px solid var(--line);
  animation: slideDown 0.2s ease-out;
}
.camp-toggle {
  cursor: pointer;
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 12px; color: var(--muted); font-weight: 500;
}
.camp-toggle:hover { color: var(--ink); }

/* Gantt */
.gantt-wrap {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r-lg); padding: 20px;
  margin-bottom: 1.5rem; overflow-x: auto;
}
.gantt-months {
  display: grid; grid-template-columns: 150px repeat(4, 1fr);
  margin-bottom: 10px; font-size: 11px; font-weight: 600;
  color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase;
}
.gantt-row {
  display: grid; grid-template-columns: 150px 1fr;
  align-items: center; gap: 10px; margin-bottom: 10px;
}
.gantt-label {
  font-size: 12px; font-weight: 600; color: var(--ink-2);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.gantt-bar {
  position: relative; height: 14px;
  background: var(--surface-2); border-radius: 100px;
  overflow: hidden;
}
.gantt-bar > div {
  position: absolute; top: 0; height: 100%;
  border-radius: 100px;
  transition: all 0.3s;
}
.gantt-legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 11px; color: var(--muted); margin-bottom: 14px; }
.gantt-legend .sw { display: inline-block; width: 14px; height: 8px; border-radius: 100px; margin-right: 5px; vertical-align: middle; }

/* Hero banner (Today view) */
.hero {
  background: linear-gradient(135deg, var(--navy-900), var(--navy-700) 60%, var(--navy-500));
  border-radius: var(--r-xl);
  padding: 32px; color: white;
  margin-bottom: 1.5rem; position: relative; overflow: hidden;
}
.hero::after {
  content: ""; position: absolute;
  right: -80px; top: -80px;
  width: 240px; height: 240px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255,255,255,0.12), transparent 70%);
}
.hero .greeting {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 36px; font-weight: 700; letter-spacing: -0.035em;
  line-height: 1.1; margin-bottom: 8px;
}
.hero .date { font-size: 14px; opacity: 0.82; }
.hero .stats { display: flex; gap: 24px; margin-top: 16px; flex-wrap: wrap; }
.hero .stat .v { font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700; }
.hero .stat .l { font-size: 11px; opacity: 0.78; text-transform: uppercase; letter-spacing: 0.08em; }

/* Quick add */
.quick-add-fab {
  position: fixed; bottom: 24px; right: 24px;
  width: 56px; height: 56px; border-radius: 50%;
  background: linear-gradient(135deg, var(--navy-700), var(--navy-500));
  color: white; border: none; cursor: pointer;
  box-shadow: 0 8px 24px rgba(30,58,138,0.4);
  display: flex; align-items: center; justify-content: center;
  z-index: 60;
  transition: transform 0.15s;
}
.quick-add-fab:hover { transform: scale(1.08) rotate(90deg); }
.quick-add-fab svg { width: 24px; height: 24px; stroke: white; }

/* Modal */
.modal-backdrop {
  position: fixed; inset: 0;
  background: rgba(11,30,63,0.5);
  z-index: 100; display: none;
  align-items: center; justify-content: center;
  padding: 1rem;
  animation: fadeIn 0.15s;
}
.modal-backdrop.open { display: flex; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal {
  background: var(--surface); border-radius: var(--r-xl);
  max-width: 560px; width: 100%;
  max-height: 90vh; overflow-y: auto;
  padding: 28px;
  box-shadow: var(--shadow-lg);
  animation: modalIn 0.2s ease-out;
}
@keyframes modalIn { from { opacity: 0; transform: translateY(20px) scale(0.97); } to { opacity: 1; transform: translateY(0) scale(1); } }
.modal h2 { font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 16px; }

/* Settings panel */
.settings-backdrop {
  position: fixed; inset: 0; background: rgba(11,30,63,0.45);
  z-index: 90; display: none;
}
.settings-backdrop.open { display: block; }
.settings {
  position: fixed; top: 0; right: 0; bottom: 0;
  width: 380px; max-width: 100vw;
  background: var(--surface); border-left: 1px solid var(--line);
  z-index: 95; transform: translateX(100%);
  transition: transform 0.22s;
  overflow-y: auto;
}
.settings.open { transform: translateX(0); }
.settings-hdr {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 20px; border-bottom: 1px solid var(--line);
  position: sticky; top: 0; background: var(--surface); z-index: 2;
}
.settings-body { padding: 20px; }
.drag-item {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px; background: var(--surface-2);
  border-radius: var(--r-md); margin-bottom: 6px;
  border: 1px solid var(--line); cursor: grab;
  font-size: 13px;
}
.drag-handle { color: var(--muted); cursor: grab; flex-shrink: 0; }
.drag-item.dragging { opacity: 0.5; }

/* Views */
.view-segmented {
  display: inline-flex;
  background: var(--surface-2); border-radius: var(--r-md);
  padding: 3px; gap: 2px;
}
.view-segmented button {
  background: transparent; border: none; cursor: pointer;
  padding: 5px 12px; font-size: 12px; font-weight: 600;
  border-radius: 7px; color: var(--muted);
  transition: all 0.15s;
}
.view-segmented button.on {
  background: var(--surface); color: var(--ink);
  box-shadow: var(--shadow-sm);
}

/* Calendar */
.cal-grid {
  display: grid; grid-template-columns: repeat(7, 1fr);
  gap: 2px; background: var(--line); border: 1px solid var(--line);
  border-radius: var(--r-md); overflow: hidden;
}
.cal-head {
  background: var(--surface-2); padding: 8px;
  font-size: 11px; font-weight: 600; color: var(--muted);
  text-align: center; text-transform: uppercase; letter-spacing: 0.06em;
}
.cal-cell {
  background: var(--surface); padding: 8px;
  min-height: 92px; position: relative;
  font-size: 11px;
  display: flex; flex-direction: column; gap: 3px;
}
.cal-cell.muted { background: var(--surface-2); color: var(--muted); }
.cal-cell.today { background: var(--info-bg); }
.cal-cell .d { font-weight: 600; font-size: 12px; color: var(--ink); margin-bottom: 4px; }
.cal-cell.today .d { color: var(--navy-600); }
.cal-item {
  font-size: 10px; padding: 2px 5px;
  border-radius: 3px; color: white;
  background: var(--navy-500);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  cursor: pointer;
}
.cal-item.overdue { background: var(--danger); }
.cal-item.done { opacity: 0.5; text-decoration: line-through; }

/* Filters bar */
.filters {
  display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
  margin-bottom: 1.25rem;
}
.filters select, .filters input {
  font-size: 12px; padding: 6px 10px;
  border: 1px solid var(--line-2); border-radius: var(--r-md);
  background: var(--surface); color: var(--ink);
}

/* Mobile */
.mobile-overlay {
  position: fixed; inset: 0; background: rgba(11,30,63,0.5);
  z-index: 49; display: none;
}
.mobile-overlay.on { display: block; }

@media (max-width: 900px) {
  .sidebar {
    position: fixed; top: 0; left: 0; height: 100vh;
    transform: translateX(-100%);
    box-shadow: var(--shadow-lg);
    width: 280px;
  }
  .sidebar.mobile-open { transform: translateX(0); }
  .sidebar.collapsed { width: 280px; }
  .sidebar.collapsed .sb-label,
  .sidebar.collapsed .sb-section-title,
  .sidebar.collapsed .sb-brand-text,
  .sidebar.collapsed .sb-count,
  .sidebar.collapsed .sb-user-meta { display: block; }
  .sidebar.collapsed .sb-item { justify-content: flex-start; padding: 8px 10px; }
  .sidebar.collapsed .sb-brand { justify-content: flex-start; padding: 1.125rem 1rem 1rem; }
  .sidebar.collapsed .sb-user { justify-content: flex-start; }
  .content { padding: 1.25rem 1rem 4rem; }
  .pg-header h1 { font-size: 28px; }
  .hero { padding: 24px; }
  .hero .greeting { font-size: 28px; }
  .tb-search { display: none; }
  .tb-title { font-size: 15px; }
  .camp-body { flex-direction: column; }
  .camp-img { width: 100%; height: 140px; }
  .gantt-row { grid-template-columns: 110px 1fr; }
  .gantt-label { font-size: 11px; }
  .gantt-months { grid-template-columns: 110px repeat(4, 1fr); }
  .task-exp { margin-left: 8px; margin-right: 8px; }
  .modal { padding: 20px; }
}
@media (max-width: 540px) {
  .content { padding: 1rem 0.75rem 5rem; }
  .pg-header { flex-direction: column; align-items: stretch; }
  .pg-header h1 { font-size: 24px; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .met { padding: 12px 14px; }
  .met .mv { font-size: 24px; }
  .cal-cell { min-height: 64px; padding: 4px; }
  .cal-cell .d { font-size: 11px; }
  .cal-item { font-size: 9px; }
  .task-due { width: 100%; text-align: right; margin-left: 0; }
  .topbar { padding: 0 12px; }
  .quick-add-fab { bottom: 16px; right: 16px; }
}

/* Scrollbar */
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 6px; }
::-webkit-scrollbar-thumb:hover { background: var(--muted); }

/* Utility */
.hidden { display: none !important; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.muted { color: var(--muted); }
.empty {
  text-align: center; padding: 3rem 1rem;
  color: var(--muted); font-size: 14px;
}
.empty-icon { font-size: 32px; margin-bottom: 12px; opacity: 0.5; }
.divider { height: 1px; background: var(--line); margin: 20px 0; }
hr { border: none; border-top: 1px solid var(--line); margin: 16px 0; }

/* Comment */
.comment {
  padding: 10px 0; border-bottom: 1px solid var(--line);
  font-size: 13px;
}
.comment:last-child { border-bottom: none; }
.comment .hdr { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-bottom: 3px; }
.comment .hdr b { color: var(--ink); font-weight: 600; }
.comment .body { color: var(--ink-2); line-height: 1.5; }

/* Request card */
.req-card {
  background: var(--surface); border: 1px solid var(--line);
  border-left: 3px solid var(--warn);
  border-radius: var(--r-md); padding: 14px 16px;
  margin-bottom: 10px;
}
.req-card.accepted { border-left-color: var(--ok); }
.req-card.rejected { border-left-color: var(--danger); }

/* Priority picker button */
.prio-btn {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 3px 8px; border-radius: var(--r-sm);
  border: 1px solid var(--line-2); background: var(--surface);
  font-size: 11px; cursor: pointer; color: var(--muted);
}
.prio-btn.high { color: var(--p-high); border-color: var(--p-high); }
.prio-btn.med { color: var(--p-med); border-color: var(--p-med); }
.prio-btn.low { color: var(--p-low); border-color: var(--p-low); }

/* Label tag */
.label-tag {
  display: inline-flex; align-items: center; gap: 3px;
  padding: 2px 8px; border-radius: 4px;
  font-size: 10px; font-weight: 600; letter-spacing: 0.03em;
  text-transform: uppercase;
}
</style>
</head>
<body>

<!-- SETUP -->
<div id="setup-screen">
  <div class="setup-card">
    <div class="setup-logo">
      <img id="setup-logo-img" alt="1-Group">
    </div>
    <h1 class="display">Welcome back</h1>
    <div class="sub">Connect to your shared workspace to continue.</div>
    <input type="text" id="sc-binid" placeholder="Bin ID (leave blank for new)" style="display:none">
    <input type="password" id="sc-key" placeholder="JSONBin Master Key">
    <button class="btn primary" onclick="doSetup()" style="width:100%;justify-content:center;padding:12px;margin-top:4px" id="sc-btn">Connect</button>
    <div class="msg" id="sc-msg"></div>
    <div id="sc-share"></div>
    <div class="note">
      Your API key stays on this device. Get a free key at <a href="https://jsonbin.io" target="_blank">jsonbin.io</a>
    </div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="sb-brand">
      <img alt="1-Group" id="brand-logo">
      <div class="sb-brand-text">
        <div class="t1">1-Group</div>
        <div class="t2">Marketing Team</div>
      </div>
    </div>

    <div class="sb-scroll" id="sb-scroll"></div>

    <div class="sb-footer">
      <button class="sb-item" onclick="openSettings()">
        <span class="sb-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></span>
        <span class="sb-label">Settings</span>
      </button>
      <div class="sb-user">
        <div class="sb-avatar" id="user-avatar">MK</div>
        <div class="sb-user-meta">
          <div class="n" id="user-name">Marketing Team</div>
          <div class="s">Live sync on</div>
        </div>
      </div>
    </div>
  </aside>

  <div class="mobile-overlay" id="mobile-overlay" onclick="closeMobileSidebar()"></div>

  <!-- MAIN -->
  <main class="main">
    <header class="topbar">
      <button class="tb-toggle" onclick="toggleSidebar()" aria-label="Toggle sidebar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div class="tb-title" id="tb-title">Today</div>
      <input type="text" class="tb-search" id="tb-search" placeholder="Search tasks, campaigns…" oninput="S.search=this.value;render()">
      <div class="tb-sync" id="tb-sync"><span class="dot"></span><span id="tb-sync-label">Live</span></div>
      <button class="tb-action" onclick="toggleTheme()" aria-label="Toggle theme" title="Toggle theme">
        <svg id="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      </button>
      <button class="tb-action" onclick="manualRefresh()" aria-label="Refresh" title="Refresh">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
      </button>
      <button class="tb-action" onclick="showShareURL()" aria-label="Share" title="Share">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
      </button>
    </header>

    <div class="content" id="content"></div>
  </main>
</div>

<!-- Quick-add FAB -->
<button class="quick-add-fab hidden" id="quick-fab" onclick="openQuickAdd()" aria-label="Quick add">
  <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
</button>

<!-- Quick-add modal -->
<div class="modal-backdrop" id="qa-modal" onclick="if(event.target===this)closeQuickAdd()">
  <div class="modal">
    <h2 class="display">Quick add</h2>
    <input type="text" class="field" id="qa-name" placeholder="Task name…" style="margin-bottom:10px;font-size:15px;padding:10px 12px">
    <div class="exp-grid">
      <div>
        <div class="exp-label">Campaign</div>
        <select class="field" id="qa-camp"></select>
      </div>
      <div>
        <div class="exp-label">Due date</div>
        <input type="date" class="field" id="qa-due">
      </div>
      <div>
        <div class="exp-label">Priority</div>
        <select class="field" id="qa-prio"><option value="">None</option><option value="high">High</option><option value="med">Medium</option><option value="low">Low</option></select>
      </div>
      <div>
        <div class="exp-label">Assign</div>
        <select class="field" id="qa-who"></select>
      </div>
    </div>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px">
      <button class="btn" onclick="closeQuickAdd()">Cancel</button>
      <button class="btn primary" onclick="saveQuickAdd()">Add task</button>
    </div>
  </div>
</div>

<!-- Settings -->
<div class="settings-backdrop" id="settings-bd" onclick="closeSettings()"></div>
<aside class="settings" id="settings">
  <div class="settings-hdr">
    <h2 class="display" style="font-size:18px">Settings</h2>
    <button class="btn sm" onclick="closeSettings()">Close</button>
  </div>
  <div class="settings-body" id="settings-body"></div>
</aside>
